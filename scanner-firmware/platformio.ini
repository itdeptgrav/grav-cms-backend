; PlatformIO config for the GRAV scanner firmware.
; Alternative to the Arduino IDE — same result, same binary.
;
; Usage from VS Code (PlatformIO extension installed):
;   Open the folder  D:\GRAV_Project\GRAV_BARCODE_SCANNER\firmware
;   Build   : Ctrl+Alt+B      (or the ✓ in the blue status bar)
;   Upload  : Ctrl+Alt+U      (or the → arrow)
;   Monitor : Ctrl+Alt+S      (serial, 115200)

[platformio]
; The sketch lives in its own folder rather than the usual src/.
src_dir = GRAV_Scanner_v5_5_0

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; ── Partition table — REQUIRED ────────────────────────────────────────────────
; default.csv is PlatformIO's equivalent of the Arduino IDE's
;   "Default 4MB with spiffs (1.2MB APP / 1.5MB SPIFFS)"
; The 1.5MB data partition is where the LittleFS offline queue lives. Without
; it the queue falls back to RAM only and queued scans are lost on reboot.
; It keeps ota_0/ota_1, so OTA still works.
board_build.partitions = default.csv
board_build.filesystem = littlefs

; ── Libraries ─────────────────────────────────────────────────────────────────
; ArduinoJson is PINNED TO v6 on purpose. The firmware uses StaticJsonDocument,
; which v7 removed — building against v7 fails. Do not relax this to ^7.
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    bblanchon/ArduinoJson @ ^6.21.5

build_flags =
    -DCORE_DEBUG_LEVEL=0
